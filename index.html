<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI Video Generator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 25px;
}

h1 {
    text-align: center;
}

textarea {
    width: 100%;
    height: 130px;
    padding: 12px;
    box-sizing: border-box;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}

select, button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border-radius: 8px;
    font-size: 16px;
}

button {
    background: black;
    color: white;
    border: none;
}

.video {
    margin-top: 25px;
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 My AI Video Generator</h1>

<p>अपना Video Prompt लिखें:</p>

<textarea id="prompt"
placeholder="जैसे: बारिश में एक लड़का सड़क पर चल रहा है, realistic cinematic video"></textarea>

<p>Video Ratio:</p>

<select id="ratio">
<option>9:16 - Shorts / Reels</option>
<option>16:9 - YouTube</option>
</select>

<p>Duration:</p>

<select id="duration">
<option>5 Seconds</option>
<option>10 Seconds</option>
</select>

<button onclick="generateVideo()">
🚀 Generate Video
</button>

<div class="video" id="result">
🎥 आपका वीडियो यहाँ दिखाई देगा
</div>

</div>

<script>

function generateVideo() {

let prompt = document.getElementById("prompt").value;

if (prompt.trim() === "") {
alert("पहले Video Prompt लिखिए!");
return;
}

document.getElementById("result").innerHTML =
"⏳ Video तैयार किया जा रहा है...";

setTimeout(function() {

document.getElementById("result").innerHTML =
"✅ Demo तैयार है! अगले Step में असली AI Video Generator जोड़ेंगे।";

}, 2000);

}

</script>

</body>
</html>
